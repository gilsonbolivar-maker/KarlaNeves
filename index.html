<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karla Neves · Painel</title>
<meta name="theme-color" content="#7a3e55">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel Karla">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header><button class="hbtn" id="engr" aria-label="Ajustes" style="display:none">⚙️</button><button class="hbtn" id="atual" aria-label="Atualizar" style="display:none">⟳</button><h1 id="tNeg">Karla Neves</h1><small id="tSub">Painel de acompanhamento</small></header>
<main id="main"><div class="carregando">Carregando…</div></main>
<button class="fab" id="fab" style="display:none"></button>
<nav id="nav" style="display:none">
  <button data-v="hoje" class="on"><span>☀️</span>Visão geral</button>
  <button data-v="clientes"><span>👩</span>Clientes</button>
  <button data-v="lembretes"><span>📝</span>Lembretes</button>
</nav>
<div id="sheet"><div class="box" id="sbox"></div></div>
<div class="versao" id="versao"></div>

<script src="vendor/supabase.js"></script>
<script src="comum.js"></script>
<script>
const VERSAO='3.1.0';
// MODO DE TESTE: o painel entra sozinho nesta conta, sem pedir e-mail.
// Para voltar a pedir login, troque para: const MODO_TESTE=null;
const MODO_TESTE={email:'painel-teste@karlaneves.app',password:'3dpyPc7S07q_X8tjYHe5YU6r'};
$('#versao').textContent='v'+VERSAO;
const sb=window.SB_MOCK||supabase.createClient(KN.URL,KN.CHAVE);
let S={clientes:[],ativ:[],lemb:[],msgs:[],perfil:{nome:'',zap:''}};
let VIEW='hoje',CLI=null,BUSCA='',FILTRO_A='abertas',USER=null;

/* ---------- acesso ---------- */
async function iniciar(){
  let {data}=await sb.auth.getSession();
  USER=data.session?data.session.user:null;
  if(!USER&&MODO_TESTE){const r=await sb.auth.signInWithPassword(MODO_TESTE);
    if(r.error){telaLogin();return $('#lgMsg').innerHTML=`<div class="aviso">A entrada automática falhou: ${esc(traduz(r.error.message))}</div>`}
    USER=r.data.user}
  if(!USER)return telaLogin();
  $('#nav').style.display='';$('#engr').style.display='';$('#atual').style.display='';
  await carregar();render();
}
function telaLogin(modo){
  ['#nav','#engr','#atual','#fab'].forEach(s=>$(s).style.display='none');
  const criar=modo==='criar';
  $('#main').innerHTML=`<div class="card" style="margin-top:24px">
    <h2 style="margin-top:0">${criar?'Criar sua conta':'Entrar no painel'}</h2>
    <label>E-mail</label><input id="lgEmail" type="email" autocomplete="username" autocapitalize="off">
    <label>Senha ${criar?'(mínimo 6 caracteres)':''}</label><input id="lgSenha" type="password" autocomplete="${criar?'new-password':'current-password'}">
    <div class="acoes"><button class="btn p full" id="lgOk">${criar?'Criar conta':'Entrar'}</button></div>
    <div class="sub" style="text-align:center;margin-top:12px">${criar?'Já tem conta? <a href="#" id="lgTroca">Entrar</a>':'Primeira vez? <a href="#" id="lgTroca">Criar conta</a>'}</div>
    <div id="lgMsg"></div></div>`;
  $('#lgTroca').onclick=e=>{e.preventDefault();telaLogin(criar?'entrar':'criar')};
  $('#lgOk').onclick=async()=>{
    const email=$('#lgEmail').value.trim(),password=$('#lgSenha').value;
    if(!email||!password)return toast('Preencha e-mail e senha');
    $('#lgOk').disabled=true;
    if(criar){
      const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
      $('#lgOk').disabled=false;
      if(error)return $('#lgMsg').innerHTML=`<div class="aviso">${esc(traduz(error.message))}</div>`;
      if(!data.session)return $('#lgMsg').innerHTML=`<div class="aviso"><b>Conta criada.</b> Abra o e-mail que chegou e toque no link de confirmação. Depois volte aqui e toque em <b>Entrar</b>.</div>`;
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      $('#lgOk').disabled=false;
      if(error)return $('#lgMsg').innerHTML=`<div class="aviso">${esc(traduz(error.message))}</div>`;
    }
    iniciar();
  };
}
function traduz(m){m=String(m||'');
  if(/Invalid login/i.test(m))return 'E-mail ou senha errados.';
  if(/not confirmed/i.test(m))return 'Falta confirmar o e-mail. Abra o e-mail de confirmação e toque no link.';
  if(/already registered/i.test(m))return 'Esse e-mail já tem conta. Toque em Entrar.';
  if(/at least 6/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Espere alguns minutos.';
  return m;}

/* ---------- dados ---------- */
async function carregar(){
  const [c,a,l,p,m]=await Promise.all([
    sb.from('clientes').select('*').order('nome'),
    sb.from('atividades').select('*').order('prazo',{ascending:true,nullsFirst:false}),
    sb.from('lembretes').select('*').order('data',{ascending:true,nullsFirst:false}),
    sb.from('perfis').select('*').maybeSingle(),
    sb.from('mensagens').select('*').order('criado',{ascending:true})]);
  const erro=c.error||a.error||l.error||p.error||m.error;
  if(erro){toast('Erro ao carregar: '+erro.message);return false}
  S.clientes=c.data||[];S.ativ=a.data||[];S.lemb=l.data||[];S.msgs=m.data||[];
  if(!p.data){const n=await sb.from('perfis').insert({nome:'Karla Neves'}).select().single();S.perfil=n.data||{nome:'Karla Neves',zap:''}}else S.perfil=p.data;
  return true;
}
async function grava(promessa,ok){const {error}=await promessa;if(error){toast('Não salvou: '+error.message);return false}
  await carregar();render();if(ok)toast(ok);return true}
const cli=id=>S.clientes.find(c=>c.id===id)||{nome:'(cliente apagada)'};
const arroba=c=>(c.insta||'').replace(/^@/,'').trim();
const linkCliente=c=>new URL('cliente.html',location.href).href+'#'+c.token;
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&USER){if(await carregar())render()}});
$('#atual').onclick=async()=>{toast('Atualizando…');if(await carregar()){render();toast('Atualizado')}};

/* ---------- navegação ---------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));
function ir(v,cid){VIEW=v;CLI=cid||null;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===(v==='cliente'?'clientes':v)));render();scrollTo(0,0)}
window.ir=ir;
$('#engr').onclick=()=>ir('ajustes');
function render(){
  $('#tNeg').textContent=S.perfil.nome||'Painel';
  $('#tSub').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const f=$('#fab');f.style.display=VIEW==='ajustes'?'none':'';
  if(VIEW==='cliente'){f.textContent='+ Atividade';f.onclick=()=>formAtiv(null,CLI)}
  else if(VIEW==='lembretes'){f.textContent='+ Lembrete';f.onclick=()=>formLemb()}
  else if(VIEW==='clientes'){f.textContent='+ Cliente';f.onclick=()=>formCliente()}
  else{f.textContent='+ Atividade';f.onclick=()=>formAtiv()}
  ({hoje:vHoje,clientes:vClientes,cliente:vCliente,lembretes:vLembretes,ajustes:vAjustes})[VIEW]();
}
function sec(t,n,html){return `<h2>${t}${n?`<span class="n">${n}</span>`:''}</h2>${html}`}

/* ---------- cartão de atividade ---------- */
function cardAtiv(a,comCliente){
  const c=cli(a.cliente_id);const at=atrasada(a);
  const passos=a.tipo==='video'?['pendente','gravado','feito']:['pendente','feito'];const i=passos.indexOf(a.status);
  const tag=at?'<span class="tag s-atrasada">atrasada</span>':`<span class="tag s-${a.status}">${a.status==='feito'?(a.tipo==='tarefa'?'feito':'postado'):ETAPA[a.status]}</span>`;
  let ac='';
  if(a.status!=='feito'&&at)ac+=`<button class="btn z" onclick="cobra('${a.id}')">Cobrar</button>`;
  if(a.status!=='feito'&&!a.visto_em)ac+=`<button class="btn" onclick="avisaNova('${a.id}')">Avisar pelo WhatsApp</button>`;
  if(a.status!=='pendente')ac+=`<button class="btn v" onclick="formMsg('${a.cliente_id}','parabens','${a.id}')">🎉 Parabenizar</button>`;
  if(a.link_post)ac+=`<a class="btn" href="${esc(a.link_post)}" target="_blank">Ver post</a>`;
  return `<div class="card" style="${a.status==='feito'?'opacity:.75':''}"><div class="row" onclick="formAtiv('${a.id}')">
    <div class="grow">${comCliente?`<div class="nome">${esc(c.nome)}</div>`:''}
    <div class="${comCliente?'sub':'nome'}" style="white-space:normal">${TIPOS[a.tipo]} · ${esc(a.titulo||'Sem título')}</div>
    <div class="sub">${a.status==='feito'?'Feito '+haQuanto(a.feito_em):(at?'<b style="color:var(--verm)">Prazo era '+quando(a.prazo)+'</b>':'Prazo '+quando(a.prazo))}${a.status!=='feito'?(a.visto_em?' · 👁️ viu':' · não abriu ainda'):''}</div>
    ${a.nota_cliente?`<div class="sub" style="margin-top:4px">💬 "${esc(a.nota_cliente)}"</div>`:''}</div>${tag}</div>
    <div class="etapas">${passos.map((e,k)=>`<i class="${k<=i?'ok':''}"></i>`).join('')}</div>
    ${ac?`<div class="acoes">${ac}</div>`:''}</div>`;
}
window.cobra=id=>{const a=S.ativ.find(x=>x.id===id);formMsg(a.cliente_id,'cobranca',id)};
window.avisaNova=id=>{const a=S.ativ.find(x=>x.id===id),c=cli(a.cliente_id);
  abreZap(c.tel,`Oi, ${c.nome.split(' ')[0]}! Tem atividade nova na sua página: ${TIPOS[a.tipo]} "${a.titulo}", prazo ${quando(a.prazo)}.\n\nAbra aqui: ${linkCliente(c)}`)};

/* ---------- VISÃO GERAL ---------- */
function vHoje(){
  const h=hojeISO();const abertas=S.ativ.filter(a=>a.status!=='feito');
  const movimento=S.ativ.filter(a=>a.status!=='pendente'&&a.atualizado&&(Date.now()-new Date(a.atualizado))<3*864e5).sort((x,y)=>y.atualizado.localeCompare(x.atualizado));
  const atras=abertas.filter(atrasada);
  const breve=abertas.filter(a=>!atrasada(a)&&a.prazo&&a.prazo<=somaDias(h,2));
  const sumidas=S.clientes.filter(c=>!c.ultimo_acesso||difDias(c.ultimo_acesso.slice(0,10),h)>=3);
  const meus=S.lemb.filter(l=>!l.cliente_id&&!l.feito&&(!l.data||l.data<=h));
  const mes=h.slice(0,7);const feitasMes=S.ativ.filter(a=>a.status==='feito'&&(a.feito_em||'').startsWith(mes));
  const noPrazo=feitasMes.filter(a=>!a.prazo||a.feito_em.slice(0,10)<=a.prazo).length;
  let o='';
  if(!S.clientes.length)o+=`<div class="card"><b>Como funciona:</b><br>1. Em <b>Clientes</b>, cadastre cada cliente.<br>2. Cada cliente ganha uma <b>página própria</b>. Mande o link para ela.<br>3. Crie atividades e lembretes. Eles aparecem na página dela.<br>4. Quando ela marcar "gravei" ou "postei", você vê aqui.<br><br>Para testar, toque na ⚙️ e carregue os exemplos.</div>`;
  o+=`<div class="resumo" style="margin-top:6px"><div class="card"><b>${abertas.length}</b><span class="sub">em aberto</span></div><div class="card"><b style="color:${atras.length?'var(--verm)':'var(--vinho)'}">${atras.length}</b><span class="sub">atrasadas</span></div><div class="card"><b>${feitasMes.length}</b><span class="sub">feitas no mês${feitasMes.length?' · '+Math.round(noPrazo/feitasMes.length*100)+'% no prazo':''}</span></div></div>`;
  const naoLidas=S.msgs.filter(m=>m.autor==='cliente'&&!m.lida_em);
  if(naoLidas.length){const porCli={};naoLidas.forEach(m=>{(porCli[m.cliente_id]=porCli[m.cliente_id]||[]).push(m)});
    o+=sec('Mensagens novas das clientes',naoLidas.length,Object.entries(porCli).map(([cid,ms])=>{const u=ms[ms.length-1];
      return `<div class="card" style="border-left:4px solid var(--zap)" onclick="conversa('${cid}')"><div class="row"><div class="grow"><div class="nome">${esc(cli(cid).nome)}${ms.length>1?' · '+ms.length+' mensagens':''}</div>
      <div class="sub" style="white-space:normal">💬 ${esc(u.texto.slice(0,120))}</div><div class="sub">${haQuanto(u.criado)}</div></div><span class="btn">Abrir</span></div></div>`}).join(''))}
  if(meus.length)o+=sec('Seus lembretes',meus.length,meus.map(cardLemb).join(''));
  o+=sec('O que as clientes fizeram (3 dias)',movimento.length,movimento.slice(0,15).map(a=>{const c=cli(a.cliente_id);
    return `<div class="card" onclick="ir('cliente','${c.id}')"><div class="row"><div class="grow"><div class="nome">${esc(c.nome)}</div>
    <div class="sub" style="white-space:normal">${a.status==='gravado'?'🎥 Gravou':a.tipo==='tarefa'?'✅ Concluiu':'📲 Postou'}: ${esc(a.titulo)} · ${haQuanto(a.atualizado)}</div>
    ${a.nota_cliente?`<div class="sub">💬 "${esc(a.nota_cliente)}"</div>`:''}</div></div>
    <div class="acoes" onclick="event.stopPropagation()"><button class="btn v" onclick="formMsg('${c.id}','parabens','${a.id}')">🎉 Parabenizar</button>${a.link_post?`<a class="btn" href="${esc(a.link_post)}" target="_blank">Ver post</a>`:''}</div></div>`}).join('')||'<div class="vazio">Nenhuma novidade.</div>');
  o+=sec('Atrasadas',atras.length,atras.map(a=>cardAtiv(a,true)).join('')||'<div class="vazio">Nenhuma atrasada. 👏</div>');
  if(breve.length)o+=sec('Vencem até depois de amanhã',breve.length,breve.map(a=>cardAtiv(a,true)).join(''));
  if(sumidas.length)o+=sec('Não abrem a página há 3+ dias',sumidas.length,sumidas.map(c=>`<div class="card"><div class="row"><div class="grow" onclick="ir('cliente','${c.id}')"><div class="nome">${esc(c.nome)}</div><div class="sub">Último acesso: ${haQuanto(c.ultimo_acesso)}</div></div><button class="btn z" onclick="enviaLink('${c.id}')">Mandar link</button></div></div>`).join(''));
  $('#main').innerHTML=o;
}

/* ---------- CLIENTES ---------- */
function resumoCli(c){const as=S.ativ.filter(a=>a.cliente_id===c.id);const ab=as.filter(a=>a.status!=='feito');
  const mes=hojeISO().slice(0,7);const fm=as.filter(a=>a.status==='feito'&&(a.feito_em||'').startsWith(mes)).length;
  return {ab:ab.length,at:ab.filter(atrasada).length,fm,total:as.length,pct:as.length?Math.round(as.filter(a=>a.status==='feito').length/as.length*100):0}}
function vClientes(){
  const b=BUSCA.toLowerCase();
  const lista=S.clientes.filter(c=>!b||c.nome.toLowerCase().includes(b)||arroba(c).toLowerCase().includes(b));
  let o=`<input id="busca" placeholder="🔍 Buscar por nome ou @" value="${esc(BUSCA)}" style="margin:4px 0 10px"><div class="sub" style="margin:0 4px 8px">${S.clientes.length} cliente(s)</div>`;
  o+=lista.map(c=>{const r=resumoCli(c);const nl=S.msgs.filter(m=>m.cliente_id===c.id&&m.autor==='cliente'&&!m.lida_em).length;return `<div class="card" onclick="ir('cliente','${c.id}')"><div class="row"><div class="grow"><div class="nome">${esc(c.nome)}${nl?` <span class="tag" style="background:var(--zap);color:#fff">💬 ${nl} nova(s)</span>`:''}</div>
    <div class="sub">${arroba(c)?'@'+esc(arroba(c))+' · ':''}${r.ab} em aberto${r.at?` · <b style="color:var(--verm)">${r.at} atrasada(s)</b>`:''} · ${r.fm} feita(s) no mês</div>
    <div class="sub">Abriu a página: ${haQuanto(c.ultimo_acesso)}</div></div><span style="font-weight:800;color:var(--verde)">${r.pct}%</span></div>
    <div class="barra"><i style="width:${r.pct}%"></i></div></div>`}).join('')||'<div class="vazio">Nenhuma cliente. Toque em <b>+ Cliente</b>.</div>';
  $('#main').innerHTML=o;
  const i=$('#busca');i.oninput=()=>{BUSCA=i.value;const p=i.selectionStart;vClientes();const n=$('#busca');n.focus();n.setSelectionRange(p,p)};
}
function vCliente(){
  const c=S.clientes.find(x=>x.id===CLI);if(!c)return ir('clientes');
  const r=resumoCli(c);
  const as=S.ativ.filter(a=>a.cliente_id===c.id);
  const F={abertas:a=>a.status!=='feito',feitas:a=>a.status==='feito'};
  const lista=as.filter(F[FILTRO_A]).sort((x,y)=>FILTRO_A==='feitas'?(y.feito_em||'').localeCompare(x.feito_em||''):(x.prazo||'9999').localeCompare(y.prazo||'9999'));
  const lb=S.lemb.filter(l=>l.cliente_id===c.id&&(!l.feito||(Date.now()-new Date(l.feito_em||0))<7*864e5));
  const ms=S.msgs.filter(m=>m.cliente_id===c.id);marcaLidas(c.id);
  $('#main').innerHTML=`<button class="voltar" onclick="ir('clientes')">‹ Clientes</button>
  <div class="card"><div class="row"><div class="grow"><div class="nome" style="font-size:19px">${esc(c.nome)}</div>
  <div class="sub">${arroba(c)?`<a href="https://instagram.com/${esc(arroba(c))}" target="_blank">@${esc(arroba(c))}</a> · `:''}${c.tel?esc(c.tel):'sem WhatsApp'}</div>
  <div class="sub">Abriu a página: ${haQuanto(c.ultimo_acesso)}</div></div></div>
  ${c.obs?`<div class="caixa">${esc(c.obs)}</div>`:''}
  <div class="acoes"><button class="btn z" onclick="enviaLink('${c.id}')">Mandar link da página</button><a class="btn" href="${esc(linkCliente(c))}" target="_blank">👁️ Ver como ela vê</a>
  <button class="btn" onclick="copiaLink('${c.id}')">Copiar link</button><button class="btn" onclick="formCliente('${c.id}')">Editar</button></div></div>
  <div class="resumo"><div class="card"><b>${r.ab}</b><span class="sub">em aberto</span></div><div class="card"><b style="color:${r.at?'var(--verm)':'var(--vinho)'}">${r.at}</b><span class="sub">atrasadas</span></div><div class="card"><b>${r.fm}</b><span class="sub">feitas no mês</span></div></div>
  <h2>Mensagens${ms.length?`<span class="n">${ms.length}</span>`:''}</h2>
  <div class="card">${ms.slice(-3).map(bolha).join('')||'<div class="vazio">Nenhuma mensagem ainda.</div>'}
  <div class="chips" style="margin-top:8px"><button class="chip" onclick="formMsg('${c.id}','cobranca')">⏰ Cobrar</button><button class="chip" onclick="formMsg('${c.id}','parabens')">🎉 Parabenizar</button><button class="chip" onclick="formMsg('${c.id}','lembrete')">📌 Lembrete</button><button class="chip" onclick="formMsg('${c.id}')">💬 Mensagem</button></div>
  ${ms.length>3?`<div class="acoes"><button class="btn full" onclick="conversa('${c.id}')">Ver conversa inteira</button></div>`:''}</div>
  <h2>Atividades</h2>
  <div class="chips" style="margin:0 2px 8px"><button class="chip ${FILTRO_A==='abertas'?'on':''}" onclick="FILTRO_A='abertas';render()">Em aberto (${as.filter(F.abertas).length})</button><button class="chip ${FILTRO_A==='feitas'?'on':''}" onclick="FILTRO_A='feitas';render()">Feitas (${as.filter(F.feitas).length})</button></div>
  ${lista.map(a=>cardAtiv(a,false)).join('')||'<div class="vazio">Nada aqui. Toque em <b>+ Atividade</b>.</div>'}
  <h2>Lembretes na página dela${lb.length?`<span class="n">${lb.length}</span>`:''}</h2>
  ${lb.map(cardLemb).join('')||'<div class="vazio">Nenhum lembrete.</div>'}
  <div class="acoes"><button class="btn" onclick="formLemb(null,'${c.id}')">+ Lembrete para ${esc(c.nome.split(' ')[0])}</button></div>`;
}
window.enviaLink=id=>{const c=cli(id);abreZap(c.tel,`Oi, ${c.nome.split(' ')[0]}! Esta é a sua página de acompanhamento. Lá estão suas atividades, roteiros e lembretes:\n\n${linkCliente(c)}\n\nSalve na tela inicial do celular para abrir rápido 😉`)};
window.copiaLink=async id=>{try{await navigator.clipboard.writeText(linkCliente(cli(id)));toast('Link copiado')}catch(e){prompt('Copie o link:',linkCliente(cli(id)))}};

/* ---------- folha ---------- */
function abre(html){$('#sbox').innerHTML='<button class="fecha" onclick="fecha()">×</button>'+html;$('#sheet').classList.add('on');$('#sbox').scrollTop=0}
window.fecha=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')fecha()};
const opcoesCli=sel=>S.clientes.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)}</option>`).join('');

window.formCliente=cid=>{
  const c=cid?S.clientes.find(x=>x.id===cid):{nome:'',tel:'',insta:'',obs:''};
  abre(`<h3>${cid?'Editar cliente':'Nova cliente'}</h3>
  <label>Nome</label><input id="fNome" value="${esc(c.nome)}" autocomplete="off">
  <label>WhatsApp (com DDD)</label><input id="fTel" type="tel" inputmode="tel" value="${esc(c.tel)}" placeholder="77 99999-9999">
