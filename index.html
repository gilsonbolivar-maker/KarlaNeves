<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karla Neves · Clientes</title>
<meta name="theme-color" content="#7a3e55">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clientes">
<style>
:root{--vinho:#7a3e55;--vinho2:#5e2c41;--creme:#fbf8f6;--texto:#2b2226;--suave:#7c6c73;--linha:#eadde2;--verde:#2f8f5b;--verm:#c0392b;--amar:#c98a12;--zap:#1fa855;--roxo:#5b3a9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--creme);color:var(--texto);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--vinho);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:19px;font-weight:700}
header small{opacity:.8;font-size:13px}
#engr{float:right;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;font-size:20px;padding:6px 10px;margin-top:2px}
main{padding:12px 12px 110px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--vinho);font-weight:700}
h2{font-size:15px;margin:18px 4px 8px;color:var(--vinho2);display:flex;justify-content:space-between;align-items:center}
h2 .n{background:var(--vinho);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
.card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.nome{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--suave);font-size:13.5px}
.vazio{color:var(--suave);font-size:14px;padding:6px 4px 2px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--linha);background:#fff;color:var(--texto);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600}
.btn.p{background:var(--vinho);border-color:var(--vinho);color:#fff}
.btn.z{background:var(--zap);border-color:var(--zap);color:#fff}
.btn.v{color:var(--verde);border-color:#bfe3cd}
.btn.r{color:var(--verm);border-color:#f0c4be}
.btn.full{width:100%;padding:13px;font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;white-space:nowrap}
.s-a_enviar{background:#fff2d9;color:var(--amar)}.s-enviado{background:#efe7fb;color:var(--roxo)}.s-gravado{background:#e3effb;color:#1f5f9a}.s-postado{background:#e3f4ea;color:var(--verde)}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resumo .card{margin:0;text-align:center}
.resumo b{display:block;font-size:22px;color:var(--vinho)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;background:var(--vinho);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(94,44,65,.35)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--linha);border-radius:10px;background:#fff;color:var(--texto)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;color:var(--suave);margin:12px 2px 4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.busca{margin:4px 0 10px}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(30,15,22,.45)}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--creme);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#sheet h3{margin:0 0 4px;font-size:18px;color:var(--vinho2)}
.fecha{float:right;border:0;background:none;font-size:26px;line-height:1;color:var(--suave)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:#fff;border-radius:16px;padding:6px 11px;font-size:13.5px}
.chip.on{background:var(--vinho);border-color:var(--vinho);color:#fff}
.etapas{display:flex;gap:4px;margin-top:8px}
.etapas i{flex:1;height:5px;border-radius:3px;background:var(--linha)}
.etapas i.ok{background:var(--vinho)}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#2b2226;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:85vw;text-align:center}
#toast.on{opacity:1}
#versao{position:fixed;right:6px;bottom:calc(62px + env(safe-area-inset-bottom));font-size:10px;color:#b9a8b0;z-index:5}
.aviso{background:#fff2d9;border:1px solid #f2d79c;color:#7a5410;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.hist{border-top:1px solid var(--linha);padding:8px 0;font-size:14px}
a{color:var(--vinho)}
</style>
</head>
<body>
<header><button id="engr" aria-label="Ajustes">⚙️</button><h1 id="tNeg">Karla Neves</h1><small id="tSub"></small></header>
<main id="main"></main>
<button class="fab" id="fab">+ Postagem</button>
<nav>
  <button data-v="hoje" class="on"><span>☀️</span>Hoje</button>
  <button data-v="posts"><span>🎬</span>Postagens</button>
  <button data-v="lembretes"><span>📝</span>Lembretes</button>
  <button data-v="clientes"><span>👩</span>Clientes</button>
</nav>
<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>
<div id="versao"></div>

<script>
const VERSAO='2.0.0';
document.getElementById('versao').textContent='v'+VERSAO;

/* ---------- dados ---------- */
const CHAVE='karla-clientes-v1';
const PADRAO={clientes:[],posts:[],lembretes:[],config:{
  negocio:'Karla Neves',zapKarla:'',diasParada:7,
  msgEnvio:'Oi, {nome}! 🎬 Seu próximo vídeo: "{titulo}". Prazo para postar: {prazo}.\n\nAbra este link, o roteiro já entra no teleprompter do Legendas:\n{link}\n\nLegenda para o post:\n{legenda}\n\nReferências:\n{links}',
  msgCobra:'Oi, {nome}! Passando para lembrar do vídeo "{titulo}", o prazo era {prazo}. Conseguiu gravar? Se travou em algo, me fala que eu te ajudo 💜',
  msgParada:'Oi, {nome}! Faz {dias} dias sem post no seu Instagram. Bora gravar um vídeo esta semana? Te mando o roteiro 🎬',
  msgAniver:'Feliz aniversário, {nome}! 🎉 Muita saúde e alegria. Um beijo, {negocio}.'
},ultimoBackup:null};
const ETAPAS=['a_enviar','enviado','gravado','postado'];
const NOME_ET={a_enviar:'a enviar',enviado:'enviado',gravado:'gravado',postado:'postado'};
let D;
function carregar(){try{D=JSON.parse(localStorage.getItem(CHAVE))}catch(e){D=null}
  if(!D)D=JSON.parse(JSON.stringify(PADRAO));
  D.config=Object.assign({},PADRAO.config,D.config||{});
  D.clientes=D.clientes||[];D.lembretes=D.lembretes||[];
  if(!D.posts){ // migração da versão 1.x
    D.posts=(D.conteudos||[]).map(k=>({id:k.id,demo:k.demo,clienteId:k.clienteId,titulo:k.titulo||'',data:k.data||'',repete:k.repete||'nao',
      roteiro:k.roteiro||'',legenda:k.legenda||'',links:k.links||'',anexos:k.anexos||[],linkPost:'',
      status:k.status==='postado'?'postado':k.status==='enviado'?'enviado':'a_enviar'}));
  }
  delete D.conteudos;delete D.atend;delete D.servicos;}
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(D))}catch(e){toast('Erro ao salvar!')}}
carregar();salvar();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hojeISO=()=>iso(new Date());
const somaDias=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const difDias=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const dataBR=s=>s?s.split('-').reverse().join('/'):'';
function quando(s){if(!s)return'sem prazo';const d=difDias(hojeISO(),s);return d===0?'hoje':d===1?'amanhã':d===-1?'ontem':dataBR(s)}
const cli=i=>D.clientes.find(c=>c.id===i)||{nome:'(cliente apagada)',tel:''};
const arroba=c=>(c.insta||'').replace(/^@/,'').trim();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function telZap(t){let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(d.length<=11)d='55'+d;return d}
function msg(mod,c,ex){return mod.replace(/\{(\w+)\}/g,(m,k)=>(Object.assign({nome:(c.nome||'').split(' ')[0],negocio:D.config.negocio},ex||{}))[k]??m)
  .replace(/\n[^\n]*:\n(?=\n|$)/g,'\n').replace(/\n{3,}/g,'\n\n').trim()}
function zap(c,texto){const t=telZap(c.tel);if(!t){toast('Cliente sem WhatsApp cadastrado');return false}
  window.open('https://wa.me/'+t+'?text='+encodeURIComponent(texto),'_blank');return true}
function ultimoPost(cid){let u=null;D.posts.forEach(p=>{if(p.clienteId===cid&&p.status==='postado'){const d=p.postadoEm||p.data;if(d&&(!u||d>u))u=d}});return u}
function linkLegendas(p){const q=new URLSearchParams();q.set('r',p.roteiro||'');q.set('t',p.titulo||'vídeo');
  if(D.config.zapKarla)q.set('k',telZap(D.config.zapKarla));q.set('n',D.config.negocio||'');
  return new URL('legendas/',location.href).href+'#'+q.toString()}
function exPost(p){return{titulo:p.titulo||'vídeo',prazo:quando(p.data),legenda:p.legenda||'',links:p.links||'',link:p.roteiro?linkLegendas(p):''}}
function ordPost(a,b){return ((a.data||'9999')).localeCompare(b.data||'9999')}
const atrasado=p=>p.status!=='postado'&&p.data&&p.data<hojeISO();

/* ---------- arquivos (IndexedDB) ---------- */
const ARQ=(()=>{let dbp=null;
  function db(){return dbp||(dbp=new Promise((ok,er)=>{const r=indexedDB.open('karla-arquivos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}))}
  async function op(modo,fn){const d=await db();return new Promise((ok,er)=>{const t=d.transaction('f',modo);const r=fn(t.objectStore('f'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>er(t.error)})}
  return{put:(k,v)=>op('readwrite',s=>s.put(v,k)),get:k=>op('readonly',s=>s.get(k)),del:k=>op('readwrite',s=>s.delete(k))};
})();
const tamTxt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const blobB64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
const b64Blob=async u=>(await fetch(u)).blob();

/* ---------- navegação ---------- */
let VIEW='hoje',BUSCA='',FILTRO='abertas';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();scrollTo(0,0)});
window.irAjustes=()=>{VIEW='ajustes';document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));render();scrollTo(0,0)};
$('#engr').onclick=irAjustes;

function render(){
  $('#tNeg').textContent=D.config.negocio||'Clientes';
  $('#tSub').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const f=$('#fab');f.style.display=VIEW==='ajustes'?'none':'';
  f.textContent=VIEW==='clientes'?'+ Cliente':VIEW==='lembretes'?'+ Lembrete':'+ Postagem';
  f.onclick=VIEW==='clientes'?()=>formCliente():VIEW==='lembretes'?()=>formLemb():()=>formPost();
  ({hoje:vHoje,posts:vPosts,lembretes:vLembretes,clientes:vClientes,ajustes:vAjustes})[VIEW]();
}
function sec(t,n,html){return `<h2>${t}${n?`<span class="n">${n}</span>`:''}</h2>${html}`}

/* ---------- cartão de postagem ---------- */
function cardPost(p){
  const c=cli(p.clienteId);const i=ETAPAS.indexOf(p.status);const at=atrasado(p);
  let ac='';
  if(p.status==='a_enviar')ac+=`<button class="btn z" onclick="enviaPost('${p.id}')">Enviar para a cliente</button>`;
  if(p.status==='enviado'||p.status==='gravado'){
    if(at)ac+=`<button class="btn z" onclick="cobraPost('${p.id}')">Cobrar</button>`;
    else ac+=`<button class="btn" onclick="enviaPost('${p.id}')">Reenviar</button>`;
    if(p.status==='enviado')ac+=`<button class="btn" onclick="avanca('${p.id}','gravado')">Gravou</button>`;
    ac+=`<button class="btn v" onclick="avanca('${p.id}','postado')">✓ Postou</button>`;
  }
  if(p.status==='postado'&&arroba(c))ac+=`<a class="btn" style="text-decoration:none" href="${esc(p.linkPost||'https://instagram.com/'+arroba(c))}" target="_blank">Ver no Instagram</a>`;
  return `<div class="card" style="${p.status==='postado'?'opacity:.7':''}"><div class="row" onclick="formPost('${p.id}')">
    <div class="grow"><div class="nome">${esc(c.nome)}${arroba(c)?` <span class="sub" style="font-weight:400">@${esc(arroba(c))}</span>`:''}</div>
    <div class="sub" style="white-space:normal">${esc(p.titulo||'Sem título')} · ${at?'<b style="color:var(--verm)">Atrasado ('+quando(p.data)+')</b>':'Prazo '+quando(p.data)}${(p.anexos||[]).length?' · 📎':''}${p.repete&&p.repete!=='nao'?' · 🔁':''}</div></div>
    <span class="tag s-${p.status}">${NOME_ET[p.status]}</span></div>
    <div class="etapas">${ETAPAS.map((e,k)=>`<i class="${k<=i?'ok':''}"></i>`).join('')}</div>
    ${ac?`<div class="acoes">${ac}</div>`:''}</div>`;
}
window.enviaPost=kid=>{const p=D.posts.find(x=>x.id===kid),c=cli(p.clienteId);
  if(!p.roteiro&&!p.legenda)toast('Dica: escreva o roteiro para a cliente gravar no Legendas');
  if(!zap(c,msg(D.config.msgEnvio,c,exPost(p))))return;
  if(p.status==='a_enviar'){p.status='enviado';p.enviadoEm=hojeISO();salvar();setTimeout(render,500)}
  if((p.anexos||[]).length)setTimeout(()=>{if(confirm('Esta postagem tem arquivo. Enviar o arquivo agora?'))enviaArquivo(kid)},900)};
window.cobraPost=kid=>{const p=D.posts.find(x=>x.id===kid),c=cli(p.clienteId);if(zap(c,msg(D.config.msgCobra,c,exPost(p)))){p.cobradoEm=hojeISO();salvar()}};
window.avanca=(kid,st)=>{const p=D.posts.find(x=>x.id===kid);p.status=st;
  if(st==='postado'){p.postadoEm=hojeISO();
    if(p.repete&&p.repete!=='nao'&&!p.proxCriado){const base=p.data||hojeISO();
      const prox=p.repete==='semanal'?somaDias(base,7):p.repete==='quinzenal'?somaDias(base,14):(()=>{const d=new Date(base+'T12:00');d.setMonth(d.getMonth()+1);return iso(d)})();
      D.posts.push({id:id(),clienteId:p.clienteId,titulo:p.titulo,data:prox,repete:p.repete,roteiro:'',legenda:'',links:p.links||'',anexos:[],linkPost:'',status:'a_enviar'});
      p.proxCriado=true;salvar();render();return toast('Postado! Próxima criada para '+dataBR(prox)+'. Falta escrever o roteiro.')}}
  salvar();render();toast(st==='postado'?'Marcado como postado':'Marcado como gravado')};
window.enviaArquivo=async kid=>{const p=D.posts.find(x=>x.id===kid);const files=[];
  for(const a of (p.anexos||[])){const r=await ARQ.get(a.id);if(r)files.push(new File([r.blob],a.nome,{type:a.tipo}))}
  if(!files.length)return toast('Sem arquivo');
  try{await navigator.clipboard.writeText(p.legenda||'')}catch(e){}
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}catch(e){if(e.name==='AbortError')return}
  files.forEach(f=>{const u=URL.createObjectURL(f);const l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)});
  toast('Arquivo baixado')};

/* ---------- HOJE ---------- */
function vHoje(){
  const h=hojeISO(),am=somaDias(h,1);
  const abertas=D.posts.filter(p=>p.status!=='postado');
  const atras=abertas.filter(atrasado).sort(ordPost);
  const aEnviar=abertas.filter(p=>p.status==='a_enviar'&&!atrasado(p)&&(!p.data||p.data<=somaDias(h,3))).sort(ordPost);
  const prazo=abertas.filter(p=>p.status!=='a_enviar'&&(p.data===h||p.data===am)).sort(ordPost);
  const lembHoje=D.lembretes.filter(l=>!l.feito&&(!l.data||l.data<=h)).sort(ordLemb);
  const paradas=D.clientes.map(c=>({c,u:ultimoPost(c.id)})).filter(x=>{const dias=x.u?difDias(x.u,h):difDias(x.c.criado||h,h);
      return dias>=D.config.diasParada&&!abertas.some(p=>p.clienteId===x.c.id)&&!(x.c.avisadaEm&&difDias(x.c.avisadaEm,h)<5)})
    .map(x=>({...x,dias:x.u?difDias(x.u,h):null}));
  const aniv=D.clientes.filter(c=>c.aniver).map(c=>{const[m,d]=c.aniver.split('-');const ano=new Date().getFullYear();let s=ano+'-'+m+'-'+d;if(s<h)s=(ano+1)+'-'+m+'-'+d;return{c,s,dd:difDias(h,s)}}).filter(x=>x.dd<=7).sort((a,b)=>a.dd-b.dd);
  const mes=h.slice(0,7);const doMes=D.posts.filter(p=>p.status==='postado'&&(p.postadoEm||p.data||'').startsWith(mes));
  const noPrazo=doMes.filter(p=>!p.data||(p.postadoEm||p.data)<=p.data).length;
  let o='';
  if(!D.clientes.length)o+=`<div class="card"><b>Comece por aqui:</b><br>1. Em <b>Clientes</b>, cadastre as clientes com WhatsApp e @ do Instagram.<br>2. Em <b>+ Postagem</b>, escreva o roteiro e o prazo.<br>3. Toque em <b>Enviar para a cliente</b>: ela recebe o link que abre o roteiro no Legendas.<br><br>Para testar, vá na ⚙️ e carregue os exemplos.</div>`;
  if(lembHoje.length)o+=sec('Lembretes',lembHoje.length,lembHoje.map(cardLemb).join(''));
  o+=sec('Atrasadas',atras.length,atras.map(cardPost).join('')||'<div class="vazio">Nenhuma atrasada. 👏</div>');
  o+=sec('Prazo hoje e amanhã',prazo.length,prazo.map(cardPost).join('')||'<div class="vazio">Nada vencendo.</div>');
  if(aEnviar.length)o+=sec('Roteiros para enviar',aEnviar.length,aEnviar.map(cardPost).join(''));
  if(paradas.length)o+=sec(`Clientes paradas (+${D.config.diasParada} dias)`,paradas.length,paradas.map(x=>cardCli(x.c,x.dias!==null?'Último post: '+dataBR(x.u)+' · há '+x.dias+' dias':'Ainda não postou nada',`<button class="btn z" onclick="chamaParada('${x.c.id}',${x.dias??0})">Chamar</button>`)).join(''));
  if(aniv.length)o+=sec('Aniversários (7 dias)',aniv.length,aniv.map(x=>cardCli(x.c,x.dd===0?'🎂 É hoje!':'🎂 '+dataBR(x.s).slice(0,5)+' · em '+x.dd+' dia(s)',`<button class="btn z" onclick="zap(cli('${x.c.id}'),msg(D.config.msgAniver,cli('${x.c.id}')))">Parabéns</button>`)).join(''));
  o+=`<h2>Este mês</h2><div class="resumo"><div class="card"><b>${doMes.length}</b><span class="sub">vídeos postados</span></div><div class="card"><b>${doMes.length?Math.round(noPrazo/doMes.length*100)+'%':'–'}</b><span class="sub">no prazo</span></div></div>`;

const REP={nao:'Não repete',diario:'Todo dia',semanal:'Toda semana',mensal:'Todo mês'};
function ordLemb(a,b){return ((a.data||'0000')+(a.hora||'')).localeCompare((b.data||'0000')+(b.hora||''))}
function cardLemb(l){
  const h=hojeISO();const at=l.data&&l.data<h&&!l.feito;const c=l.clienteId?cli(l.clienteId):null;
  const q=l.data?(l.data===h?'Hoje':l.data===somaDias(h,1)?'Amanhã':dataBR(l.data))+(l.hora?' às '+l.hora:''):'Sem data';
  return `<div class="card" style="${l.feito?'opacity:.55':''}"><div class="row">
    <button class="btn ${l.feito?'v':''}" style="padding:6px 10px;font-size:18px" onclick="feitoLemb('${l.id}')">${l.feito?'✓':'○'}</button>
    <div class="grow" onclick="formLemb('${l.id}')"><div class="nome" style="white-space:normal;${l.feito?'text-decoration:line-through':''}">${esc(l.texto)}</div>
    <div class="sub">${at?'<b style="color:var(--verm)">Atrasado · </b>':''}${q}${l.repete&&l.repete!=='nao'?' · 🔁 '+REP[l.repete]:''}${c?' · 👩 '+esc(c.nome):''}</div></div></div></div>`;
}
function vLembretes(){
  const pend=D.lembretes.filter(l=>!l.feito).sort(ordLemb);const feitos=D.lembretes.filter(l=>l.feito).sort(ordLemb).reverse().slice(0,30);
  let o=sec('A fazer',pend.length,pend.map(cardLemb).join('')||'<div class="vazio">Nada pendente. Toque em <b>+ Lembrete</b>.</div>');
  if(feitos.length)o+=sec('Feitos',0,feitos.map(cardLemb).join('')+`<div class="acoes"><button class="btn r" onclick="limpaFeitos()">Apagar os feitos</button></div>`);

window.feitoLemb=lid=>{const l=D.lembretes.find(x=>x.id===lid);l.feito=!l.feito;
  if(l.feito&&l.repete&&l.repete!=='nao'&&!l.proxCriado){const base=l.data||hojeISO();
    const prox=l.repete==='diario'?somaDias(base,1):l.repete==='semanal'?somaDias(base,7):(()=>{const d=new Date(base+'T12:00');d.setMonth(d.getMonth()+1);return iso(d)})();
    D.lembretes.push({...l,id:id(),data:prox,feito:false,proxCriado:false,demo:l.demo});l.proxCriado=true;toast('Feito! Próximo: '+dataBR(prox))}
  else toast(l.feito?'Feito!':'Voltou para a fazer');salvar();render()};

window.formLemb=lid=>{
  const l=lid?D.lembretes.find(x=>x.id===lid):{texto:'',data:hojeISO(),hora:'',clienteId:'',repete:'nao',feito:false};
  const opts=D.clientes.slice().sort((x,y)=>x.nome.localeCompare(y.nome,'pt')).map(c=>`<option value="${c.id}" ${c.id===l.clienteId?'selected':''}>${esc(c.nome)}</option>`).join('');

  <label>Repetir</label><select id="lRep">${Object.entries(REP).map(([k,v])=>`<option value="${k}" ${l.repete===k?'selected':''}>${v}</option>`).join('')}</select>
  <label>Cliente (opcional)</label><select id="lCli"><option value="">Nenhuma</option>${opts}</select>
  <div class="acoes"><button class="btn p full" id="lOk">Salvar</button></div>
  <div class="acoes"><button class="btn full" id="lCal">📅 Salvar e pôr no calendário (com alarme)</button></div>
  ${lid?`<div class="acoes"><button class="btn r" id="lDel">Apagar lembrete</button></div>`:''}`);
  const grava=()=>{const texto=$('#lTxt').value.trim();if(!texto){toast('Escreva o lembrete');return null}
    const dados={texto,data:$('#lData').value,hora:$('#lHora').value,repete:$('#lRep').value,clienteId:$('#lCli').value};
    let obj;if(lid){Object.assign(l,dados);obj=l}else{obj={id:id(),feito:false,...dados};D.lembretes.push(obj)}salvar();fecha();render();return obj};
  $('#lOk').onclick=()=>{if(grava())toast('Lembrete salvo')};
  $('#lCal').onclick=()=>{if(!$('#lData').value)return toast('Escolha uma data');const o=grava();if(o)calendario(o)};
  if(lid)$('#lDel').onclick=()=>{if(!confirm('Apagar este lembrete?'))return;D.lembretes=D.lembretes.filter(x=>x.id!==lid);salvar();fecha();render();toast('Apagado')};
};
async function calendario(l){
  const d=l.data.replace(/-/g,'');const agora=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const txt=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');let ini,fim;
  if(l.hora){ini='DTSTART:'+d+'T'+l.hora.replace(':','')+'00';const e=new Date(l.data+'T'+l.hora);e.setMinutes(e.getMinutes()+30);fim='DTEND:'+e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate())+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'}
  else{ini='DTSTART;VALUE=DATE:'+d;fim='DTEND;VALUE=DATE:'+somaDias(l.data,1).replace(/-/g,'')}
  const rr={diario:'DAILY',semanal:'WEEKLY',mensal:'MONTHLY'}[l.repete];const c=l.clienteId?cli(l.clienteId).nome:'';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KarlaNeves//Clientes//PT','BEGIN:VEVENT','UID:'+l.id+'@karlaneves','DTSTAMP:'+agora,ini,fim,'SUMMARY:'+txt(l.texto+(c?' ('+c+')':'')),...(rr?['RRULE:FREQ='+rr]:[]),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+txt(l.texto),'TRIGGER:'+(l.hora?'-PT0M':'PT9H'),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});const file=new File([blob],'lembrete.ics',{type:'text/calendar'});
  try{if(/Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='lembrete.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Abra o arquivo para adicionar ao calendário')}

  const cs=L.map((n,i)=>({id:id(),demo:true,nome:n[0],tel:'00 90000-00'+pad(i+1),insta:n[1],aniver:n[3],obs:n[2],criado:somaDias(h,-90)}));
  D.clientes.push(...cs);
  const R='1. Abertura: olhe para a câmera e diga o problema da cliente.\n2. Mostre o antes.\n3. Explique o que você fez em 3 passos.\n4. Mostre o depois.\n5. Chamada: "Me chama no direct para agendar."';
  const ps=(i,titulo,d,st,o)=>D.posts.push(Object.assign({id:id(),demo:true,clienteId:cs[i].id,titulo,data:somaDias(h,d),repete:'nao',roteiro:R,legenda:'',links:'https://www.instagram.com/reel/exemplo',anexos:[],linkPost:'',status:st},o||{}));
  ps(0,'Antes e depois da semana',-2,'enviado',{repete:'semanal',legenda:'Antes e depois que fala por si ✨'});
  ps(1,'Bolo do mês',-1,'gravado',{legenda:'Encomendas pelo direct 🍓'});
  ps(2,'3 exercícios em casa',0,'enviado',{repete:'semanal'});
  ps(3,'Provador: looks da semana',1,'gravado',{repete:'semanal'});
  ps(4,'Tendência de corte',3,'a_enviar');ps(5,'Mito ou verdade',2,'a_enviar',{roteiro:''});
  ps(6,'Make em 1 minuto',5,'enviado');ps(9,'Rotina da manhã',4,'enviado');
  ps(0,'Depoimento de cliente',-9,'postado',{postadoEm:somaDias(h,-9)});ps(2,'Treino rápido',-7,'postado',{postadoEm:somaDias(h,-6)});
  ps(3,'Promoção',-5,'postado',{postadoEm:somaDias(h,-5)});ps(6,'Make para festa',-4,'postado',{postadoEm:somaDias(h,-4)});
  ps(9,'Protetor solar',-3,'postado',{postadoEm:somaDias(h,-1)});ps(1,'Bolo de pote',-12,'postado',{postadoEm:somaDias(h,-11)});
  ps(8,'Banho e tosa',-40,'postado',{postadoEm:somaDias(h,-40)});ps(7,'Apresentação',-20,'postado',{postadoEm:somaDias(h,-20)});
  const lb=(texto,d,o)=>D.lembretes.push(Object.assign({id:id(),demo:true,texto,data:somaDias(h,d),hora:'',repete:'nao',clienteId:'',feito:false},o||{}));
  lb('Escrever roteiros da semana',0,{repete:'semanal'});lb('Revisar posts da Daniela',1,{clienteId:cs[3].id});lb('Chamada mensal com as clientes',4,{hora:'19:00'});
  salvar();render();toast('10 clientes de exemplo carregadas');
};
window.apagaExemplo=()=>{if(!confirm('Apagar todas as clientes de exemplo e tudo ligado a elas? Seus dados reais ficam.'))return;
  const ids=new Set(D.clientes.filter(c=>c.demo).map(c=>c.id));
  D.clientes=D.clientes.filter(c=>!c.demo);D.posts=D.posts.filter(p=>!p.demo&&!ids.has(p.clienteId));D.lembretes=D.lembretes.filter(l=>!l.demo&&!ids.has(l.clienteId));
  salvar();render();toast('Exemplos apagados')};

/* ---------- AJUSTES ---------- */
function vAjustes(){
  const c=D.config;
  $('#main').innerHTML=`
  <h2>Backup (importante)</h2>
  <div class="card">Os dados ficam <b>só neste celular</b>. Faça backup toda semana e guarde o arquivo no WhatsApp, e-mail ou Drive.
  <div class="sub" style="margin-top:6px">Último backup: ${D.ultimoBackup?dataBR(D.ultimoBackup.slice(0,10)):'nunca'}</div>
  <div class="acoes"><button class="btn p" onclick="backup()">Fazer backup</button><button class="btn" onclick="$('#arq').click()">Restaurar backup</button></div>
  <input type="file" id="arq" accept=".json,application/json" style="display:none"></div>
  <h2>Seus dados</h2>
  <div class="card"><label style="margin-top:0">Seu nome (aparece no topo e nas mensagens)</label><input id="cNeg" value="${esc(c.negocio)}">
  <label>Seu WhatsApp (para a cliente avisar que gravou)</label><input id="cZap" type="tel" inputmode="tel" value="${esc(c.zapKarla)}" placeholder="77 99999-9999">
  <label>Avisar "cliente parada" depois de quantos dias sem postar</label><input id="cDias" type="number" inputmode="numeric" value="${c.diasParada}"></div>
  <h2>Mensagens do WhatsApp</h2>
  <div class="card"><div class="sub">Pode usar: {nome} {titulo} {prazo} {link} {legenda} {links} {dias} {negocio}</div>
  <label>Enviar roteiro</label><textarea id="mEnv" style="min-height:150px">${esc(c.msgEnvio)}</textarea>
  <label>Cobrar vídeo atrasado</label><textarea id="mCob" style="min-height:90px">${esc(c.msgCobra)}</textarea>
  <label>Chamar cliente parada</label><textarea id="mPar" style="min-height:90px">${esc(c.msgParada)}</textarea>
  <label>Aniversário</label><textarea id="mAni">${esc(c.msgAniver)}</textarea></div>
  <div class="acoes"><button class="btn p full" onclick="salvaAjustes()">Salvar ajustes</button></div>
  <h2>Simulação</h2>
  <div class="card">Carrega 10 clientes fictícias com postagens em todas as etapas e lembretes. Os telefones são falsos.
  <div class="acoes"><button class="btn p" onclick="carregaExemplo()">Carregar exemplos</button><button class="btn r" onclick="apagaExemplo()">Apagar exemplos</button></div></div>
  <h2>Legendas</h2>
  <div class="card sub">As clientes gravam no Legendas. O link enviado já abre o roteiro no teleprompter.<div class="acoes"><a class="btn" style="text-decoration:none" href="legendas/" target="_blank">Abrir o Legendas</a></div></div>
  <h2>Instalar no celular</h2>
  <div class="card sub">Android (Chrome): menu ⋮ → <b>Adicionar à tela inicial</b>.<br>iPhone (Safari): botão Compartilhar → <b>Adicionar à Tela de Início</b>.</div>
  <div class="sub" style="text-align:center;margin-top:16px">Versão ${VERSAO}</div>`;
  $('#arq').onchange=restaurar;
}
window.salvaAjustes=()=>{Object.assign(D.config,{negocio:$('#cNeg').value.trim()||'Clientes',zapKarla:$('#cZap').value.trim(),diasParada:Math.max(1,parseInt($('#cDias').value)||7),
  msgEnvio:$('#mEnv').value,msgCobra:$('#mCob').value,msgParada:$('#mPar').value,msgAniver:$('#mAni').value});salvar();render();toast('Ajustes salvos')};
window.backup=async()=>{
  D.ultimoBackup=new Date().toISOString();salvar();toast('Preparando backup…');
  const nome='backup-clientes-'+hojeISO()+'.json';
  const arquivos={};for(const p of D.posts)for(const a of (p.anexos||[])){try{const r=await ARQ.get(a.id);if(r)arquivos[a.id]=await blobB64(r.blob)}catch(e){}}
  const blob=new Blob([JSON.stringify(Object.assign({},D,{arquivos}))],{type:'application/json'});const file=new File([blob],nome,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});render();toast('Backup feito');return}}catch(e){if(e.name==='AbortError')return}
  const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=nome;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);render();toast('Backup baixado')};
function restaurar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const n=JSON.parse(r.result);if(!Array.isArray(n.clientes))throw 0;
    if(!confirm('Restaurar este backup? Ele SUBSTITUI os dados atuais ('+n.clientes.length+' clientes).'))return;
    const arq=n.arquivos||{};delete n.arquivos;localStorage.setItem(CHAVE,JSON.stringify(n));carregar();
    for(const i in arq){try{await ARQ.put(i,{blob:await b64Blob(arq[i])})}catch(x){}}salvar();render();toast('Backup restaurado')}catch(x){toast('Arquivo inválido')}};
  r.readAsText(f)}

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
